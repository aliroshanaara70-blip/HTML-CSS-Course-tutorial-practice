<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4i - Stretch</title>
    <style>
        .stretch-btn {
            background-color: rgb(6, 130, 6);
            color: white;
            border: none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            cursor: pointer;
            transition: padding-left 0.15s, padding-right 0.15s;
        }

        .stretch-btn:hover {
            padding-left: 30px;
            padding-right: 30px;
        }
    </style>
</head>
<body>
    <button class="stretch-btn">
        Stretch
    </button>
</body>
</html>
