<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4j - 3D Click Button</title>
    <style>
        .shadow-btn {
            background-color: green;
            color: white;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            margin-left: 10px;
            margin-right: 10px;
            cursor: pointer;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.4);
            transition: margin 0.15s, box-shadow 0.15s;
        }

        .shadow-btn:active {
            margin-top: 2px;
            margin-left: 2px;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <button class="shadow-btn">
        Shadow
    </button>
</body>
</html>
