<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4k - Margin and Padding Together</title>
    <style>
        .green-btn {
            background-color: green;
            color: white;
            border: none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            margin-left: 10px;
            margin-right: 10px;
            cursor: pointer;
            transition: margin 0.15s, padding 0.15s;
        }

        .green-btn:hover {
            padding-left: 25px;
            padding-right: 25px;
            margin-left: 0px;
            margin-right: 0px;
        }
    </style>
</head>
<body>
    <button class="green-btn">
        One
    </button>

    <button class="green-btn">
        Two
    </button>

    <button class="green-btn">
        Three
    </button>
</body>
</html>
