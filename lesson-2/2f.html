<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2f - Amazon Product Challenge</title>
    <style>

        .link {
            color: rgb(0, 113, 113);
        }
        .stock {
           color: rgb(0, 118, 0);
        }

        .cart-btn {
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            height: 32px;
            width: 120px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 15px;
            font-size: 14px;
        }

        .buy-btn {
            background-color: rgba(241, 161, 42, 0.931);
            border: none;
            height: 30px;
            width: 110px;
            border-radius: 15px;
            margin-left: 6px;
            cursor: pointer;
            font-weight: 15px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.com/" target="_blank" class="link">
        Back to Amazon
    </a>

    <h1>
        Nike Black Running Shoes
    </h1>

    <p class="stock">
        $39 - in stock.
    </p>

    <p>
        Free delivery tomorrow.
    </p>

    <button class="cart-btn">
        Add to Cart
    </button>

    <button class="buy-btn">
        Buy now
    </button>
</body>
</html>
