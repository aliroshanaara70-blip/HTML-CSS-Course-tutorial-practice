<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2e - LinkedIn Button</title>
    <style>
        .apply-btn {
            background-color: rgb(10, 102, 194);
            color: white;
            border: none;
            border-radius: 25px;
            height: 40px;
            width: 220px;
            font-weight: bold;
            margin-right: 8px;
            cursor: pointer;
        }

        .save-btn {
            background-color: white;
            color: rgb(10, 102, 194);
            border-width: 1px;
            border-style: solid;
            border-radius: 20px;
            border-color: rgb(10, 102, 194);
            height: 40px;
            width: 80px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="apply-btn">
        Apply on company website
    </button>

    <button class="save-btn">
        Save
    </button>
</body>
</html>
