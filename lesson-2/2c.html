<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2c - GitHub Button</title>
    <style>
        .github-btn {
            background-color: rgb(46, 164, 79);
            color: white;
            border: none;
            border-radius: 6px;
            height: 40px;
            width: 90px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="github-btn">
        Sign up
    </button>
</body>
</html>
