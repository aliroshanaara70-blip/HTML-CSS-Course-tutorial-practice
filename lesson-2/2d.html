<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2d - Bootstrap Button</title>
    <style>
       .get-started-btn {
           background-color: rgb(121, 82, 179);
           color: white;
           border: none;
           border-radius: 6px;
           height: 40px;
           width: 110px;
           font-weight: bold;
           margin-right: 6px;
           cursor: pointer;
       }

       .download-btn {
           background-color: rgb(251, 252, 254);
           color: rgb(31, 23, 23);
           border-color: rgb(108, 117, 125);
           border-style: solid;
           border-width: 1px;
           border-radius: 4px;
           height: 40px;
           width: 110px;
           cursor: pointer;
       }
    </style>
</head>
<body>
    <button class="get-started-btn">
        Get stareted
    </button>

    <button class="download-btn">
        Download
    </button>
</body>
</html>
