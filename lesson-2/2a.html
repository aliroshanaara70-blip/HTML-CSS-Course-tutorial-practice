<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2a - Uber Button</title>
    <style>
         .uber-btn {
             background-color: black;
             color: white;
             border: none;
             border-radius: 2px;
             height: 40px;
             width: 110px;
             cursor: pointer;
         }
    </style>
</head>
<body>
    <button class="uber-btn">
        Request now
    </button>
</body>
</html>
