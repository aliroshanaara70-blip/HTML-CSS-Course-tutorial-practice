<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8e - Uber Request a Ride</title>
    <style>
        p {
            font-family: Arial;
            font-size: 40px;
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            display: block;
            background-color: rgb(240, 240, 240);
            width: 400px;
            font-size: 16px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 7px;
            padding-bottom: 7px;
            border: none;
            margin-bottom: 10px;
        }

        .destination-textbox {
            margin-bottom: 35px;
        }

        .request-btn {
            background-color: black;
            color: white;
            font-size: 16px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 7px;
            padding-bottom: 7px;
            margin-right: 20px;
            border: none;
            cursor: pointer;
        }

        .schedule-btn {
            background-color: rgb(240, 240, 240);
            font-size: 16px;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 7px;
            padding-bottom: 7px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p class="title">
        Request a ride now
    </p>

    <input class="pickup-textbox" type="text" placeholder="Enter pickup location">

    <input class="destination-textbox" type="text" placeholder="Enter destination">

    <button class="request-btn">
        Request Now
    </button>

    <button class="schedule-btn">
        Schedule fot later
    </button>
</body>
</html>
