<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8c - Google Search Form</title>
    <style>
        .google-logo {
            width: 200px;
            display: block;
            object-fit: cover;
            margin-left: 150px;
        }
        .google-search {
        width: 500px; 
        font-size: 16px;
        border: none;
        border-radius: 50px;
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 15px;
        padding-bottom: 15px;
        box-shadow: 0px 1px 6px rgba(0, 0, 0, 0.2);
     }
    </style>
</head>
<body>
    <img class="google-logo" src="google-logo.jpg" alt="Google Logo">
    <input class="google-search" type="text" placeholder="Search Google or Type a URL">
</body>
</html>
