<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8d - Sign Up Form</title>
    <style>
        .input {
            border: 1px solid;
            border-color: rgb(200, 200, 200);
            font-size: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
     .first-name {
         width: 155px;
     }

     .last-name {
         width: 155px;
     }

     .email {
        display: block;
        width: 326px;
        margin-top: 12px;
        margin-bottom: 12px;
     }

     .sign-up-btn {
         background-color: rgb(47, 127, 231);
         color: white;
         width: 334px;
         border: none;
         font-weight: bold;
         padding-left: 14px;
         padding-right: 14px;
         padding-top: 7px;
         padding-bottom: 7px;
         border-radius: 7px;
         cursor: pointer;
     }
    </style>
</head>
<body>
    <input class="first-name" type="text" placeholder="First Name">

    <input class="last-name" type="text" placeholder="Last Name">

    <input class="email" type="text" placeholder="Email">

    <button class="sign-up-btn">
        Sign Up
    </button>
</body>
</html>
