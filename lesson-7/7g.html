<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7g - Twitter Text Box</title>
    <style>
        .profile-picture {
            width: 50px;
            border-radius: 25px;
            object-fit: cover;
            vertical-align: middle;
            margin-right: 5px;
        }

        .tweet-input {
            font-family: Arial;
            font-size: 18px;
            width: 300px;
            border: none;
            vertical-align: middle;

        }

        .tweet-btn {
            background-color: rgb(29, 155, 240);
            color: white;
            border: none;
            padding-left: 16px;
            padding-right: 16px;
            padding-top: 8px;
            padding-bottom: 8px;
            border-radius: 30px;
            font-weight: bold;
            font-size: 16px;
            vertical-align: middle;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <img class="profile-picture" src="cute-cat.jpg" alt="Profile">

    <input class="tweet-input" type="text" placeholder="What's happening?">

    <button class="tweet-btn">
        Tweet
    </button>
</body>
</html>
