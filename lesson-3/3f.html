<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3f - Amazon Product Challenge</title>
    <style>

        .amazon-link {
            color: rgb(0, 113, 113);
        }

        .amazon-link:hover {
            color: rgb(199, 81, 31);
        }

        .title {
            font-weight: bold;
            font-size: 24px;
        }
        .price {
           color: rgb(0, 118, 0);
           font-weight: bold;
        }

        .add-to-cart-btn {
            background-color: rgb(255, 216, 20);
            color: black;
            border: none;
            height: 32px;
            width: 120px;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 15px;
            font-size: 14px;
            transition: background-color 0.15s, opacity 0.15s;
        }

        .add-to-cart-btn:hover {
            background-color: rgb(245, 205, 10);
        }

        .add-to-cart-btn:active {
            opacity: 0.5;
        }

        .buy-now-btn {
            background-color: rgba(241, 161, 42, 0.931);
            border: none;
            height: 30px;
            width: 110px;
            border-radius: 15px;
            margin-left: 8px;
            cursor: pointer;
            font-weight: 15px;
            font-size: 14px;
            transition: background-color 0.15s, opacity 0.15s;
        }

        .buy-now-btn:hover {
            background-color: rgb(240, 150, 15);
        }

        .buy-now-btn:active {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <a href="https://www.amazon.com/" target="_blank" class="amazon-link">
        Back to Amazon
    </a>

    <p class="title">
        Nike Black Running Shoes
    </p>

    <p class="price">
        $39 - in stock.
    </p>

    <p>
        Free delivery tomorrow.
    </p>

    <button class="add-to-cart-btn">
        Add to Cart
    </button>

    <button class="buy-now-btn">
        Buy now
    </button>
</body>
</html>
