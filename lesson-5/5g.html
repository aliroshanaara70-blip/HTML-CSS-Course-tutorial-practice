<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5g - Tweet Layout</title>
    <style>
      p {
          font-family: Arial;
          font-size: 18px;
          margin-top: 0;
          margin-bottom: 0;
      }

      .tweet-header {
          margin-bottom: 5px;
      }

      .author-name {
          font-weight: bold;
      }

      .author-handle {
          color: rgb(100, 100, 100);
      }

      .tweet-body {
          width: 600px;
          line-height: 25px;
          margin-bottom: 20px;
      }

      .mention {
          color: rgb(29, 155, 240);
          cursor: pointer;
      }
    </style>
</head>
<body>
   <p class="tweet-header">
       <span class="author-name">freeCodeCamp.org</span>
       <span class="author-handle">@freeCodeCamp 1h</span>
   </p>

   <p class="tweet-body">
       As a web developer, you'll want to make your projects easy to use and navigate around.
    </p>

    <p class="tweet-body">
        Here <span class="mention">@chp_it</span> outlines the top skills new developers should have.
    </p>

</body>
</html>
