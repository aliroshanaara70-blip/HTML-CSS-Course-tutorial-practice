<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5e - MacBook Pro</title>
    <style>
      p {
          font-family: Arial;
          margin-top: 0;
          margin-bottom: 0;
          text-align: center;
      }

      .new-tag {
          font-size: 14px;
          color: rgb(245, 99, 0);
          margin-bottom: 10px;
      }

      .product-name {
          font-size: 24px;
          font-weight: bold;
          margin-bottom: 5px;
      }

      .headline {
          font-weight: bold;
          font-size: 45px;
          margin-bottom: 15px;
      }

      .price {
          margin-bottom: 25px;
      }

      .buy-btn {
          color: white;
          background-color: rgb(0, 113, 227);
          border: none;
          padding-left: 15px;
          padding-right: 15px;
          padding-top: 7px;
          padding-bottom: 7px;
          border-radius: 30px;
          cursor: pointer;
      }
    </style>
</head>
<body>
    <p class="new-tag">
        New
    </p>

    <p class="product-name">
        MacBook Pro
    </p>

    <p class="headline">
        Supercharged for pros.
    </p>

    <p class="price">
        From $1999
    </p>
    
    <p>
        <span class="buy-btn">
            Buy
        </span>
    </p>
</body>
</html>
