<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5c - HTML CSS Course</title>
    <style>
        p {
            font-family: Verdana;
            margin-top: 0;
            margin-bottom: 0;
        }

        .title {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 3px;
        }

        .subtitle {
            color: rgb(100, 100, 100);
            margin-bottom: 18px;
        }

        .description {
            width:300px;
            margin-bottom: 18px;
            line-height: 22px;
        }

        .start-btn {
            background-color: rgb(40, 179, 28);
            color: white;
            border: none;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 16px;
            padding-right: 16px;
            font-family: Verdana;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <p class="title">
        HTML CSS Course
    </p>

    <p class="subtitle">
        Beginner to Pro
    </p>

    <p class="description">
        In this course, we'll learn the skills you need to become a developer.
    </p>

    <button class="start-btn">
        Get Started
    </button>
</body>
</html>
