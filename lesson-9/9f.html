<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9f - Friend Card</title>
    <style>
        p {
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
        }
        .profile-card {
            width: 210px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            padding-left: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .profile-picture {
            width: 200px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
            margin-left: 8px;
            margin-bottom: 4px;
        }

        .mutual-friends {
            color: rgb(100, 100, 100);
            margin-left: 8px;
            margin-bottom: 12px;
        }

        .add-friend-btn {
            background-color: rgb(24, 119, 242);
            color: white;
            border: none;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 4px;
            margin-left: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-card">
       <img class="profile-picture" src="images/cute-cat.jpg" alt="Profile">

       <p class="name">
           Oliver
       </p>

       <p class="mutual-friends">
           2 mutual friends
       </p>

       <button class="add-friend-btn">
           Add Friend
       </button>
    </div>
</body>
</html>
