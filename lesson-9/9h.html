<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9h - Google Search Centered</title>
    <style>
        div {
            text-align: center;
        }
        .google-logo {
            width: 200px;
            object-fit: cover;
            margin-top: 10px;
            margin-bottom: 10px;
        }
        .google-search {
        display: block;    
        width: 500px; 
        font-size: 16px;
        border: none;
        border-radius: 50px;
        padding-left: 12px;
        padding-right: 12px;
        padding-top: 15px;
        padding-bottom: 15px;
        box-shadow: 0px 1px 6px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
        margin-left: 250px;
     }

    .google-btn {
        background-color: rgb(245, 245, 245);
        border: none;
        font-size: 15px;
        padding-left: 20px;
        padding-right: 20px;
        padding-top: 12px;
        padding-bottom: 12px;
        margin-top: 10px;
        cursor: pointer;
        margin-left: 12px;
    }
    </style>
</head>
<body>
    <div>
        <img class="google-logo" src="images/google-logo.jpg" alt="Google Logo">
    <input class="google-search" type="text" placeholder="Search Google or Type a URL">

    <button class="google-btn">
        Google Search
    </button>

    <button class="google-btn">
        I'm Feeling Lucky
    </button>
    </div>
</body>
</html>
