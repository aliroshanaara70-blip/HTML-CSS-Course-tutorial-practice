<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10e - Nested Layouts Friend Cards</title>
    <style>
        p {
            font-family: Arial;
            margin-top: 0;
            margin-bottom: 0;
        }
        .profile-card {
            width: 210px;
            box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
            padding-left: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            display: inline-block;
        }

        .profile-picture {
            width: 200px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .name {
            font-weight: bold;
            font-size: 18px;
            margin-left: 8px;
            margin-bottom: 4px;
        }

        .mutual-friends-row {
            margin-left: 8px;
            margin-bottom: 10px;
        }

        .mutual-friend-picture {
            width: 30px;
            height: 30px;
            object-fit: cover;
            border-radius: 14px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .mutual-friends {
            display: inline-block;
            color: rgb(100, 100, 100);
            margin-left: 2px;
            margin-bottom: 12px;
        }

        .add-friend-btn {
            background-color: rgb(24, 119, 242);
            color: white;
            border: none;
            padding-left: 20px;
            padding-right: 20px;
            padding-top: 10px;
            padding-bottom: 10px;
            border-radius: 4px;
            margin-left: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <img class="profile-picture" src="images/cute-cat.jpg" alt="Oliver">
 
        <p class="name">
            Oliver
        </p>

        <div class="mutual-friend-row">
            <img class="mutual-friend-picture" src="images/mitsuri.jpg" alt="Mutual Friend">
            <p class="mutual-friends">
                2 mutual friends
            </p>
     
        </div>

        <button class="add-friend-btn">
            Add Friend
        </button>
    </div>

    <div class="profile-card">
        <img class="profile-picture" src="images/kawaii-animal.avif" alt="Mimi">
 
        <p class="name">
            Mimi
        </p>

        <div class="mutual-friend-row">
            <img class="mutual-friend-picture" src="images/zenitsu.jpg" alt="Mutual Friend">
            <p class="mutual-friends">
                3 mutual friends
            </p>
     
        </div>

        <button class="add-friend-btn">
            Add Friend
        </button>
    </div>

    <div class="profile-card">
        <img class="profile-picture" src="images/cartoon.avif" alt="Rex">
 
        <p class="name">
            Rex
        </p>

        <div class="mutual-friend-row">
            <img class="mutual-friend-picture" src="images/tanjiro.jpg" alt="Mutual Friend">
            <p class="mutual-friends">
                4 mutual friends
            </p>
     
        </div>

        <button class="add-friend-btn">
            Add Friend
        </button>
    </div>
</body>
</html>
